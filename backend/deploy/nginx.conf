# =============================================================================
# Sample Nginx reverse proxy for Ask La Trobe Policy DB Chatbot.
#
# Serves:
#   - Static frontend at /
#   - Backend API at /api/
#
# Assumes:
#   - Frontend files in /var/www/asklatrobe/frontend/
#   - Backend running on http://127.0.0.1:8000
#   - TLS certs from Let's Encrypt at /etc/letsencrypt/live/YOUR_DOMAIN/
#
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/asklatrobe /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name asklatrobe.example.edu.au;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asklatrobe.example.edu.au;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/asklatrobe.example.edu.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asklatrobe.example.edu.au/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/asklatrobe.access.log;
    error_log  /var/log/nginx/asklatrobe.error.log;

    # Client upload limit (queries are small)
    client_max_body_size 1m;

    # ─────────────────────────────────────────────────────────────────
    # Frontend (static files)
    # ─────────────────────────────────────────────────────────────────
    root /var/www/asklatrobe/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively, HTML never.
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }

    # ─────────────────────────────────────────────────────────────────
    # Backend API
    # ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Forward client info.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (RAG generation can take 10–20s).
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # Buffering off for SSE / streaming (future).
        proxy_buffering off;

        # Rate limiting hint (configure nginx limit_req_zone separately if needed).
    }

    # Block access to internal paths that might exist in the frontend bundle.
    location ~* /\.(git|env|DS_Store) {
        deny all;
        return 404;
    }
}