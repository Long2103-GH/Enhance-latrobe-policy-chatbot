# =============================================================================
# Production-like full stack:
#   - Backend (FastAPI)
#   - Postgres (main relational DB)
#   - Redis (reserved for future rate limiting / caching — not used yet)
#   - Qdrant (vector search)
#
# Usage:
#   docker compose up -d          # start
#   docker compose logs -f api    # tail logs
#   docker compose down           # stop
#   docker compose down -v        # stop + wipe data
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: policy-db-chatbot-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      # Database (credentials injected from host .env)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-policy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-policy_db}

      # Qdrant
      QDRANT_MODE: remote
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: policy_chunks

      # Redis (reserved for future use — not read by the app yet)
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}

      # LLM provider chain
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      LLM_FALLBACK_PROVIDER_2: ${LLM_FALLBACK_PROVIDER_2:-claude}

      # DeepSeek (primary)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}

      # Gemini (fallback 1)
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.6-flash}

      # Claude (fallback 2 — optional; boot succeeds without it)
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}

      # Embeddings
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}

      # App config
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/app.log

      # Paths
      POLICY_JSONL_PATH: /app/data/raw/policies.jsonl
    ports:
      - "8000:8000"
    volumes:
      # Mount only what the app needs at runtime.
      - ./data:/app/data:ro
      - ./logs:/app/logs
      # Persist SQLite fallback if used.
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - policy_net

  # ─────────────────────────────────────────────────────────────────────
  # Postgres
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-policy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-policy} -d ${POSTGRES_DB:-policy_db}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policy_net

  # ─────────────────────────────────────────────────────────────────────
  # Redis (reserved for future rate limiting / caching)
  #   Not currently used by the app — RateLimiter uses in-memory storage.
  #   Kept in the stack so switching storage_uri to redis:// is a one-line
  #   change in app/core/rate_limit.py when multi-replica scaling arrives.
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policy_net

  # ─────────────────────────────────────────────────────────────────────
  # Qdrant (vector search)
  # ─────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped

    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - policy_net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  app_storage:

networks:
  policy_net:
    driver: bridge
