<!DOCTYPE html>
<html lang="en-AU" data-theme="light" data-layout="rail">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ask La Trobe — a conversational assistant for La Trobe University policy, procedure and staff documentation.">
  <meta name="theme-color" content="#E4002B">
  <meta name="color-scheme" content="light dark">
  <title>Ask La Trobe - Policy Assistant</title>

  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- Speed up CDN connection setup for the markdown libraries below -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Design tokens + base styles -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/layouts.css">

  <!-- Markdown parsing + HTML sanitization (loaded from jsDelivr) -->
  <script
  src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
  crossorigin="anonymous"
  defer
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"
    crossorigin="anonymous"
    defer
  ></script>

  <!-- App scripts (deferred, executed in order) -->
  <script src="app/config.js" defer></script>
  <script src="app/api.js" defer></script>
  <script src="app/store.js" defer></script>
  <script src="app/theme.js" defer></script>
  <script src="app/markdown.js" defer></script>
  <script src="app/thread.js" defer></script>
  <script src="app/composer.js" defer></script>
  <script src="app/settings.js" defer></script>
  <script src="app/shortcuts.js" defer></script>
  <script src="app/chat.js" defer></script>
  <script src="app/main.js" defer></script>
</head>
<body>
  <div id="app-root" aria-busy="true">
    <!-- Loading skeleton; replaced by JS on boot. -->
    <div class="boot-skeleton">
      <div class="boot-skeleton__logo"></div>
      <div class="boot-skeleton__text">Loading Policy Assistant…</div>
    </div>
  </div>

  <noscript>
    <div class="noscript-notice">
      <h1>JavaScript required</h1>
      <p>Ask La Trobe - Policy Assistant needs JavaScript enabled to work. Please enable it and reload this page.</p>
    </div>
  </noscript>
</body>
</html>
